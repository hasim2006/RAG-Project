<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Backend Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            color: var(--accent-blue);
        }

        .btn-refresh {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-refresh:hover {
            background-color: #2563eb;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .badge-warn {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🛡️ RAG System Health & Admin Dashboard</h1>
            <div>
                <button class="btn-refresh" style="background-color: #8b5cf6; margin-right: 0.5rem;"
                    onclick="reindexKB()">⚡ Re-index KB</button>
                <button class="btn-refresh" onclick="fetchMetrics()">🔄 Refresh Data</button>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="card">
                <div class="card-title">⚡ Cached Entries</div>
                <div class="card-value" id="cached-entries">0</div>
            </div>
            <div class="card">
                <div class="card-title">👥 Active Sessions</div>
                <div class="card-value" id="active-sessions">0</div>
            </div>
            <div class="card">
                <div class="card-title">👍 Positive Feedback</div>
                <div class="card-value" style="color: var(--accent-green);" id="positive-feedback">0</div>
            </div>
            <div class="card">
                <div class="card-title">⚠️ Groundedness Warnings</div>
                <div class="card-value" style="color: var(--accent-red);" id="total-warnings">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="card-title">🚨 Recent Hallucination & Groundedness Alerts</div>
            <table>
                <thead>
                    <tr>
                        <th>Query</th>
                        <th>Flagged Claims</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="warnings-table-body">
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-secondary);">No ungrounded claims
                            detected yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/analytics');
                const data = await response.json();

                // Update Metric Cards
                document.getElementById('cached-entries').innerText = data.cache?.total_cached_entries || 0;
                document.getElementById('active-sessions').innerText = data.memory?.active_sessions || 0;
                document.getElementById('positive-feedback').innerText = data.feedback?.positive ?? data.feedback?.positive_count ?? 0;
                document.getElementById('total-warnings').innerText = data.groundedness?.total_warnings || 0;

                // Update Groundedness Warnings Table
                const tbody = document.getElementById('warnings-table-body');
                tbody.innerHTML = '';

                const warnings = data.groundedness?.recent_warnings || [];
                if (warnings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-secondary);">No ungrounded claims detected yet.</td></tr>';
                } else {
                    warnings.forEach(warn => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${warn.query}</td>
                            <td>${warn.claims ? warn.claims.join('<br>') : 'N/A'}</td>
                            <td><span class="badge-warn">FLAGGED</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Error fetching analytics metrics:', error);
            }
        }

        // Auto-fetch on page load
        fetchMetrics();

        async function reindexKB() {
            if (!confirm("Are you sure you want to trigger a full re-index of all documents?")) return;

            try {
                const response = await fetch('/api/reindex', { method: 'POST' });
                const result = await response.json();

                if (response.ok) {
                    alert(`✅ Success: ${result.message}\nTotal chunks indexed: ${result.total_chunks}`);
                    fetchMetrics(); // Refresh dashboard numbers
                } else {
                    alert(`❌ Error: ${result.message}`);
                }
            } catch (error) {
                console.error('Error re-indexing:', error);
                alert('Failed to trigger re-index request.');
            }
        }
    </script>
</body>

</html>
